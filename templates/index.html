<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-to-SQL Generator</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Text-to-SQL Generator</h1>
            <p>Upload a SQLite database (.db) and translate plain English to SQL</p>
        </header>

        <form id="sqlForm">
            <!-- Drag and Drop File Input -->
            <div class="input-group">
                <label>Upload SQLite Database (.db)</label>
                <div class="gradient-border-wrapper">
                    <div class="file-drop-zone" id="dropZone" onclick="document.getElementById('db_file').click()">
                        <input type="file" id="db_file" name="db_file" accept=".db,.sqlite,.sqlite3" required>
                        <span style="font-size: 1.5rem;">📁</span>
                        <p id="fileLabel">Drag & drop your <strong>.db file</strong> here, or <span style="color: #38bdf8;">browse</span></p>
                    </div>
                </div>
            </div>

            <!-- Plain English Text Box -->
            <div class="input-group">
                <label for="user_query">Plain English Query</label>
                <div class="gradient-border-wrapper">
                    <input type="text" id="user_query" placeholder="e.g., Show me all users older than 30" required>
                </div>
            </div>

            <button type="submit">Generate SQL Query</button>
        </form>

        <div class="result-container">
            <h3>Generated SQL Result</h3>
            <pre id="output">Your SQL query will appear here...</pre>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('db_file');
        const fileLabel = document.getElementById('fileLabel');

        // Drag and drop visual cues
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                fileInput.files = files;
                updateFileName(files[0].name);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (fileInput.files.length > 0) {
                updateFileName(fileInput.files[0].name);
            }
        });

        function updateFileName(name) {
            fileLabel.innerHTML = `Selected file: <span class="file-info">${name}</span>`;
        }

        // Form submission handling using FormData (Multipart)
        document.getElementById('sqlForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append("db_file", fileInput.files[0]);
            formData.append("user_query", document.getElementById('user_query').value);
            
            const output = document.getElementById('output');
            output.textContent = "Analyzing database schema & generating SQL...";

            try {
                const response = await fetch('/generate-sql', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (response.ok) {
                    output.textContent = data.sql_query;
                } else {
                    output.textContent = "Error: " + (data.detail || "Something went wrong");
                }
            } catch (err) {
                output.textContent = "Network Error: " + err.message;
            }
        });
    </script>
</body>
</html>
